<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Metronom</title>
  <style>
    :root{
      --bg:#0f1720; --card:#0b1220; --muted:#9aa6b2; --accent:#5eead4;
      --glass: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box}
    body{font-family:Inter,Segoe UI,Roboto,Helvetica,Arial; background:linear-gradient(180deg,var(--bg),#07101a); color:#e6f0f2; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;}
    .card{width:380px; background:linear-gradient(180deg,var(--card), rgba(11,18,32,0.7)); border-radius:14px; padding:22px; box-shadow:0 8px 30px rgba(2,6,23,0.6);}
    h1{font-size:18px; margin:0 0 12px 0; letter-spacing:0.4px}
    .row{display:flex; gap:12px; align-items:center}
    .bpm-display{font-weight:700; font-size:28px; line-height:1;}
    .muted{color:var(--muted); font-size:13px}
    .slider-wrap{margin:16px 0}
    input[type=range]{-webkit-appearance:none; width:100%; height:8px; border-radius:999px; background:linear-gradient(90deg,var(--accent),#60a5fa); outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:white; box-shadow:0 2px 6px rgba(0,0,0,0.4)}
    .controls{display:flex; gap:10px; margin-top:14px}
    button{flex:1; padding:10px 14px; border-radius:10px; border:0; background:var(--glass); color:var(--accent); font-weight:700; cursor:pointer; transition: background 0.2s, color 0.2s;}
    button.primary{background:linear-gradient(90deg,var(--accent),#60a5fa); color:#062024}
    button.muted-btn{background:rgba(239, 68, 68, 0.2); color:#f87171;}
    .pulse{width:84px; height:84px; border-radius:50%; background:radial-gradient(circle at 40% 30%, rgba(94,234,212,0.18), transparent 30%), rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; margin-left:auto}
    .dot{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); transition: transform 0.08s ease, background 0.08s ease}
    .dot.active{transform:scale(1.6); background:var(--accent)}
    .footer{margin-top:16px; display:flex; justify-content:space-between; align-items:center}
    .small{font-size:12px; color:var(--muted)}
    .upload{font-size:13px; color:var(--muted); cursor:pointer; text-decoration:underline}
    .select{background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted); padding:8px 10px; border-radius:8px}
    
    
    .volume-section{margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; gap:10px;}
    .volume-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
    .volume-row label{font-size:12px; color:var(--muted); width:90px; shrink:0;}
    .volume-row input[type=range]{flex:1;}
    
    @media (max-width:420px){.card{width:92vw}}
  </style>
</head>
<body>
  <div class="card" role="application" aria-label="Metronom">
    <div class="row">
      <div>
        <h1>Müzikli Metronom</h1>
        <div class="muted">Müziğini yükle, dinle, ve zamanlamasını bul!</div>
      </div>
      <div class="pulse" aria-hidden="true">
        <div class="dot" id="dot"></div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px">
      <div>
        <div class="bpm-display" id="bpm">120</div>
        <div class="muted" id="ritim">Moderato (hafif canlı)</div>
      </div>
      <div style="text-align:right">
        <div class="small">BPM</div>
        <div class="muted" id="sub">40 - 240</div>
      </div>
    </div>

    <div class="slider-wrap">
      <input id="slider" type="range" min="40" max="240" value="120" />
    </div>

    <div class="controls">
      <button id="startBtn" class="primary">Başlat</button>
      <button id="stopBtn">Durdur</button>
      <button id="muteMetroBtn" title="Metronom Sesini Aç/Kapat">🔊 Metronom</button>
    </div>

    
    <div class="volume-section">
      <div class="volume-row">
        <label for="metroVol">Metronom Sesi</label>
        <input id="metroVol" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="volume-row">
        <label for="musicVol">Müzik Sesi</label>
        <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
    </div>

    <div class="footer">
      <div class="small">
        Ton: 
        <select id="tone" class="select">
          <option value="click">Kısa Click</option>
          <option value="tick">Tık (ince)</option>
          <option value="beep">Beep</option>
        </select>
      </div>
      <div class="small">
        Müzik yükle: 
        <label class="upload">
          Ses Dosyası
          <input id="file" type="file" accept="audio/*" style="display:none">
        </label>
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const bpmDisplay = document.getElementById('bpm');
    const ritimLabel = document.getElementById('ritim');
    const dot = document.getElementById('dot');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const toneSel = document.getElementById('tone');
    const fileInput = document.getElementById('file');
    
    const muteMetroBtn = document.getElementById('muteMetroBtn');
    const metroVolInput = document.getElementById('metroVol');
    const musicVolInput = document.getElementById('musicVol');

    let audioCtx = null;
    let metroGainNode = null;
    let musicGainNode = null;

    let isPlaying = false;
    let isMetroMuted = false;
    let lastMetroVolume = 0.8;
    let currentBpm = parseInt(slider.value, 10);

    let lookahead = 25.0;
    let scheduleAheadTime = 0.1;
    let nextNoteTime = 0.0;
    let timerID = null;

    let musicBuffer = null;
    let musicSource = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        
        metroGainNode = audioCtx.createGain();
        metroGainNode.gain.value = parseFloat(metroVolInput.value);
        metroGainNode.connect(audioCtx.destination);

        
        musicGainNode = audioCtx.createGain();
        musicGainNode.gain.value = parseFloat(musicVolInput.value);
        musicGainNode.connect(audioCtx.destination);
      }
    }

    function ritimAdi(bpm){
      if (bpm < 60) return 'Largo (çok yavaş)';
      if (bpm < 76) return 'Adagio (yavaş)';
      if (bpm < 108) return 'Andante (orta)';
      if (bpm < 120) return 'Moderato (hafif canlı)';
      if (bpm < 168) return 'Allegro (Atakan)';
      return 'Presto (çok hızlı)';
    }

    function updateDisplay(){
      bpmDisplay.textContent = currentBpm;
      ritimLabel.textContent = ritimAdi(currentBpm);
    }

    slider.addEventListener('input', (e)=>{
      currentBpm = parseInt(e.target.value,10);
      updateDisplay();
    });

    //metronom ses
    metroVolInput.addEventListener('input', (e)=>{
      const val = parseFloat(e.target.value);
      if (metroGainNode) metroGainNode.gain.value = val;
      if (val === 0) {
        isMetroMuted = true;
        muteMetroBtn.textContent = '🔇 Metronom';
        muteMetroBtn.classList.add('muted-btn');
      } else {
        isMetroMuted = false;
        lastMetroVolume = val;
        muteMetroBtn.textContent = '🔊 Metronom';
        muteMetroBtn.classList.remove('muted-btn');
      }
    });

    //müzik ses
    musicVolInput.addEventListener('input', (e)=>{
      if (musicGainNode) musicGainNode.gain.value = parseFloat(e.target.value);
    });

    // metronom on off
    muteMetroBtn.addEventListener('click', ()=>{
      isMetroMuted = !isMetroMuted;
      if (isMetroMuted) {
        if (metroGainNode) metroGainNode.gain.value = 0;
        metroVolInput.value = 0;
        muteMetroBtn.textContent = '🔇 Metronom';
        muteMetroBtn.classList.add('muted-btn');
      } else {
        const targetVol = lastMetroVolume > 0 ? lastMetroVolume : 0.8;
        if (metroGainNode) metroGainNode.gain.value = targetVol;
        metroVolInput.value = targetVol;
        muteMetroBtn.textContent = '🔊 Metronom';
        muteMetroBtn.classList.remove('muted-btn');
      }
    });

    startBtn.addEventListener('click', async ()=>{
      initAudio();
      
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!isPlaying){
        isPlaying = true;
        nextNoteTime = audioCtx.currentTime + 0.05;
        
        if (musicBuffer) {
          playMusic(nextNoteTime);
        }

        scheduler();
        startBtn.disabled = true;
      }
    });

    stopBtn.addEventListener('click', ()=>{
      isPlaying = false;
      startBtn.disabled = false;
      if (timerID) { clearTimeout(timerID); timerID = null; }
      stopMusic();
    });

    function playMusic(time) {
      stopMusic();
      musicSource = audioCtx.createBufferSource();
      musicSource.buffer = musicBuffer;
      musicSource.connect(musicGainNode);
      musicSource.start(time);
    }

    function stopMusic() {
      if (musicSource) {
        try { musicSource.stop(); } catch(e){}
        musicSource.disconnect();
        musicSource = null;
      }
    }

    function scheduleNote(time){
      flash();

      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = (toneSel.value==='click') ? 'square' : (toneSel.value==='tick'?'sine':'sawtooth');
      o.frequency.setValueAtTime((toneSel.value==='tick')?1400: (toneSel.value==='beep'?800:1200), time);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(1, time + 0.001);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
      
      o.connect(g); 
      //ses connect
      g.connect(metroGainNode);
      
      o.start(time); 
      o.stop(time + 0.06);
    }

    function scheduler(){
      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
        scheduleNote(nextNoteTime);
        const secondsPerBeat = 60.0 / currentBpm;
        nextNoteTime += secondsPerBeat;
      }
      timerID = setTimeout(scheduler, lookahead);
      if (!isPlaying){ clearTimeout(timerID); timerID=null; }
    }

    function flash(){
      dot.classList.add('active');
      setTimeout(()=>dot.classList.remove('active'), 80);
    }

    fileInput.addEventListener('change', async (e)=>{
      const f = e.target.files[0];
      if (!f) return;
      initAudio();
      const data = await f.arrayBuffer();
      musicBuffer = await audioCtx.decodeAudioData(data);
    });

    updateDisplay();
  </script>
</body>
</html>
